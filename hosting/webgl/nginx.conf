# Unity's generated template decompresses .unityweb files itself. Do not attach
# Content-Encoding to those files. The game connects to Nakama and match servers
# directly; this server hosts only the compiled browser player.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(json|loader\.js)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.unityweb$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
