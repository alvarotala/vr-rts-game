# Optional, real-time diagnostic mode. No simulation acceleration.
services:
  server:
    command:
      - -frontier-port
      - "${FRONTIER_PORT:-7777}"
      - -frontier-ws-port
      - "${FRONTIER_WS_PORT:-7877}"
      - -frontier-map
      - "${FRONTIER_MAP:-rift}"
      - -frontier-listen
      - 0.0.0.0
      - -frontier-network-metrics
