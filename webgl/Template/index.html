<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Legion</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #08131d; color: #e6eff7; font: 16px system-ui, sans-serif; }
    #game { display: block; width: 100%; height: 100%; outline: none; }
    #loading { position: fixed; inset: 0; display: grid; align-content: center; justify-items: center; gap: 18px; background: #08131d; padding: 24px; text-align: center; }
    #loading[hidden] { display: none; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 64px); }
    progress { width: min(320px, 80vw); accent-color: #28b5d9; }
    #status { max-width: 560px; line-height: 1.5; }
    #fullscreen { position: fixed; right: 16px; bottom: 16px; padding: 8px 12px; color: inherit; background: #142b3e; border: 1px solid #46647a; border-radius: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="Little Legion"></canvas>
  <div id="loading" role="status" aria-live="polite">
    <h1>Little Legion</h1>
    <progress id="progress" max="1" value="0"></progress>
    <div id="status">Cargando el juego…</div>
  </div>
  <button id="fullscreen" hidden>Pantalla completa</button>
  <script>
    var canvas = document.getElementById('game');
    var loading = document.getElementById('loading');
    var statusText = document.getElementById('status');
    var english = !navigator.language.toLowerCase().startsWith('es');
    document.documentElement.lang = english ? 'en' : 'es';
    statusText.textContent = english ? 'Loading the game…' : 'Cargando el juego…';
    document.getElementById('fullscreen').textContent = english ? 'Full screen' : 'Pantalla completa';
    function failed() {
      loading.hidden = false;
      document.getElementById('progress').hidden = true;
      statusText.textContent = english ? 'The game could not start. Reload the page and try again.' : 'El juego no pudo iniciar. Recarga la página e inténtalo de nuevo.';
    }
    canvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
    var config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Frontier', productName: 'Little Legion', productVersion: '{{{ PRODUCT_VERSION }}}',
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      showBanner: function (_, type) { if (type === 'error') failed(); }
    };
    var loader = document.createElement('script');
    loader.src = 'Build/{{{ LOADER_FILENAME }}}';
    loader.onerror = failed;
    loader.onload = function () {
      createUnityInstance(canvas, config, function (value) {
        document.getElementById('progress').value = value;
      }).then(function (instance) {
        loading.hidden = true;
        canvas.focus();
        var fullscreen = document.getElementById('fullscreen');
        fullscreen.hidden = false;
        fullscreen.onclick = function () { instance.SetFullscreen(1); };
      }).catch(failed);
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
