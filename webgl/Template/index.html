<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08131d">
  <title>Little Legion</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #08131d; color: #e6eff7; font: 16px system-ui, sans-serif; overscroll-behavior: none; }
    #shell { position: fixed; inset: 0; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    .cover { position: absolute; inset: 0; display: grid; align-content: center; justify-items: center; gap: 18px; overflow: auto; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); text-align: center; background: radial-gradient(ellipse at 50% 0%, #183c4b, #08131d 70%); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(32px, 6vw, 64px); letter-spacing: -.04em; }
    h2 { font-size: clamp(24px, 4vw, 36px); }
    .eyebrow { color: #83d9e7; font-size: 12px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
    progress { width: min(320px, 80vw); accent-color: #28b5d9; }
    #status { max-width: 520px; line-height: 1.5; color: #bed2df; }
    button { min-height: 48px; padding: 12px 22px; color: #08131d; background: #83d9e7; border: 1px solid #83d9e7; border-radius: 8px; font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    button:disabled { opacity: .65; cursor: wait; }
    #fullscreen { padding: 10px 14px; font-size: 13px; color: #e6eff7; background: #142b3e; border-color: #46647a; }
    #notice { max-width: 480px; padding: 12px; background: #142b3e; border-radius: 8px; }
    @media (max-height: 430px) { .cover { gap: 12px; } h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <main id="shell">
    <canvas id="game" tabindex="0" aria-label="Little Legion"></canvas>
    <section id="loading" class="cover" aria-labelledby="title">
      <p class="eyebrow">Little Legion</p>
      <h1 id="title">Tu legión te espera.</h1>
      <p id="status" role="status" aria-live="polite">Carga el juego y lidera tu ejército.</p>
      <progress id="progress" max="1" value="0" aria-label="Carga del juego" hidden></progress>
      <button id="start" type="button">Cargar juego</button>
      <button id="fullscreen" type="button" hidden>Pantalla completa</button>
      <p id="notice" role="status" hidden></p>
      <noscript>Activa JavaScript para jugar. / Enable JavaScript to play.</noscript>
    </section>
  </main>
  <script>
    var canvas = document.getElementById('game');
    var loading = document.getElementById('loading');
    var statusText = document.getElementById('status');
    var progress = document.getElementById('progress');
    var start = document.getElementById('start');
    var fullscreen = document.getElementById('fullscreen');
    var notice = document.getElementById('notice');
    var touch = window.matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
    var english = !(navigator.language || 'en').toLowerCase().startsWith('es');
    var phase = 'idle';
    document.documentElement.lang = english ? 'en' : 'es';
    function words(es, en) { return english ? en : es; }
    document.getElementById('title').textContent = words('Tu legión te espera.', 'Your legion awaits.');
    statusText.textContent = words('Carga el juego y lidera tu ejército.', 'Load the game and lead your army.');
    start.textContent = words('Cargar juego', 'Load game');
    progress.setAttribute('aria-label', words('Carga del juego', 'Game loading'));
    fullscreen.textContent = words('Pantalla completa', 'Full screen');
    fullscreen.hidden = !(document.documentElement.requestFullscreen && document.fullscreenEnabled !== false);

    function failed() {
      phase = 'failed';
      loading.hidden = false;
      fullscreen.hidden = true;
      progress.hidden = true;
      start.disabled = false;
      start.textContent = words('Volver a cargar', 'Reload');
      statusText.textContent = words('El juego no pudo iniciar. Recarga la página e inténtalo de nuevo.', 'The game could not start. Reload the page and try again.');
    }
    canvas.addEventListener('contextmenu', function (event) { event.preventDefault(); });
    canvas.addEventListener('webglcontextlost', failed);
    var config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#if MEMORY_FILENAME
      memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Frontier', productName: 'Little Legion', productVersion: '{{{ PRODUCT_VERSION }}}',
      autoSyncPersistentDataPath: true,
      // High-density phone screens otherwise multiply GPU buffers and memory.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, touch ? 1 : 2),
      showBanner: function (_, type) { if (type === 'error') failed(); }
    };
    function loadGame() {
      phase = 'loading';
      start.disabled = true;
      start.textContent = words('Cargando…', 'Loading…');
      statusText.textContent = words('Preparando el campo de batalla…', 'Preparing the battlefield…');
      progress.hidden = false;
      var loader = document.createElement('script');
      loader.src = 'Build/{{{ LOADER_FILENAME }}}';
      loader.onerror = failed;
      loader.onload = function () {
        try {
          createUnityInstance(canvas, config, function (value) { progress.value = value; }).then(function () {
            if (phase === 'failed') return;
            phase = 'ready';
            progress.hidden = true;
            start.disabled = false;
            start.textContent = words('Jugar', 'Play');
            statusText.textContent = words('Todo listo. Toca Jugar para entrar con sonido.', 'Ready. Tap Play to enter with sound.');
          }).catch(failed);
        } catch (_) { failed(); }
      };
      document.body.appendChild(loader);
    }
    start.onclick = function () {
      if (phase === 'failed') { window.location.reload(); return; }
      if (phase === 'idle') { loadGame(); return; }
      if (phase !== 'ready') return;
      // This second gesture happens after Unity creates its audio context. Let
      // the event propagate to Unity's audio-unlock handlers on the document.
      phase = 'playing';
      loading.hidden = true;
      fullscreen.hidden = true;
      canvas.focus();
    };
    fullscreen.onclick = function () {
      var request;
      try {
        request = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        Promise.resolve(request).catch(fullscreenFailed);
      } catch (_) { fullscreenFailed(); }
    };
    function fullscreenFailed() {
      notice.textContent = words('Puedes seguir jugando sin pantalla completa.', 'You can keep playing without full screen.');
      notice.hidden = false;
    }
    document.addEventListener('fullscreenchange', function () {
      fullscreen.textContent = document.fullscreenElement ? words('Salir de pantalla completa', 'Exit full screen') : words('Pantalla completa', 'Full screen');
      notice.hidden = true;
    });
  </script>
</body>
</html>
