# Static hosting for the desktop client. The game talks to the dedicated servers
# (websocket) and to the Nakama service directly; nothing is proxied here.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/javascript application/json application/wasm text/css image/svg+xml;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(wasm|js|css|ogg|png)$ {
        add_header Cache-Control "public, max-age=86400";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
